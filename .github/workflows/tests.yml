name: tests
on: [push, pull_request]
jobs:
  self-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check skill files
        run: python3 .github/check-skills.py skills/*
      - name: Directory copy matches the originals and holds only allowed files
        run: |
          diff skills/notion-task-pages/SKILL.md directory/skills/notion-task-pages/SKILL.md
          diff skills/plain-prose/SKILL.md directory/skills/plain-prose/SKILL.md
          diff <(sed '1,/^---$/d' worker-agent/worker.md) <(sed '1,/^---$/d' directory/agents/worker.md)  # same body; the directory copy uses only accepted front matter keys
          diff LICENSE directory/LICENSE
          diff .claude-plugin/icon.png directory/.claude-plugin/icon.png
          bad=$(git ls-files directory | grep -viE '\.(md|txt|json|ya?ml|png|jpe?g|gif|webp|ico)$|(^|/)(LICENSE|\.gitignore)$' || true)
          test -z "$bad" || { echo "$bad"; exit 1; }
          ! grep -rl '^#!' directory
      - name: Self-tests (the list in AGENTS.md), with a scratch HOME
        shell: bash
        run: |
          export HOME=$(mktemp -d) SL_STATE=$(mktemp -d)
          set -e
          bash agent-watch/tests/agent-watch.test.sh
          bash compact-restore/tests/compact-restore.test.sh
          sh notes/tests/docs-limits.test.sh
          sh bg/bg --self-test
          bash tests/install.test.sh
          bash status-line/tests/price-fit.test.sh
          for t in notion/notion notion/notion-push img-shrink/img-shrink.py apify/apify agent-cost-line/agent-cost-line.py commit/commit token-report/subagent-cost; do python3 $t --self-test; done
          for t in notes/notes token-report/token-report reap-dev-servers/reap-dev-servers skills/plain-prose/check.py; do python3 $t self-test; done
          python3 -I skills/harness-audit/scripts/collect.py selftest
          python3 emu/ui.py self-test
          node browse/browse --self-test
          echo '{"model":{"display_name":"Test"}}' | bash status-line/statusline-command.sh
