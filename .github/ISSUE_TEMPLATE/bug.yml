name: Bug
description: A tool does not work.
title: "Bug: "
labels: ["bug"]
body:
  - type: input
    id: tool
    attributes:
      label: Tool
      description: The folder name, for example `notes` or `status-line`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output, and what you expected
      render: text
    validations:
      required: true
  - type: checkboxes
    id: private
    attributes:
      label: Check before sending
      options:
        - label: I removed tokens, paths with my name and private transcript text.
          required: true
